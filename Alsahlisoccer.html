<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي كرة القدم - Alsahli Soccer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a2a3a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 10px 0;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        .scoreboard {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #00ffcc;
        }
        canvas {
            background: #2e7d32;
            border: 4px solid #fff;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .controls-hint {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #ccc;
        }
    </style>
</head>
<body>

    <h1>⚽ Alsahli Soccer Challenge ⚽</h1>
    
    <div class="scoreboard">
        <div>النقاط: <span id="score">0</span></div>
        <div>المستوى: <span id="level">1</span></div>
    </div>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div class="controls-hint">التحكم: تحرك بالفأرة (Mouse) للتحكم بالمضرب وصد الكرة!</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let level = 1;

        // Player Paddle
        const paddle = {
            width: 100,
            height: 15,
            x: canvas.width / 2 - 50,
            y: canvas.height - 30,
            color: #00ffcc
        };

        // Ball
        const ball = {
            x: canvas.width / 2,
            y: 50,
            radius: 10,
            speedX: 4,
            speedY: 4,
            color: '#fff'
        };

        // Mouse Control
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            paddle.x = e.clientX - rect.left - paddle.width / 2;
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
        });

        function update() {
            ball.x += ball.speedX;
            ball.y += ball.speedY;

            // Wall Collision
            if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.speedX = -ball.speedX;
            }
            if (ball.y - ball.radius < 0) {
                ball.speedY = -ball.speedY;
            }

            // Paddle Collision
            if (
                ball.y + ball.radius >= paddle.y &&
                ball.x >= paddle.x &&
                ball.x <= paddle.x + paddle.width &&
                ball.speedY > 0
            ) {
                ball.speedY = -ball.speedY;
                score += 10;
                document.getElementById('score').innerText = score;

                if (score % 50 === 0) {
                    level++;
                    document.getElementById('level').innerText = level;
                    ball.speedX *= 1.15;
                    ball.speedY *= 1.15;
                }
            }

            // Game Over
            if (ball.y + ball.radius > canvas.height) {
                alert(`انتهت اللعبة! مجموع نقاطك: ${score}`);
                score = 0;
                level = 1;
                ball.x = canvas.width / 2;
                ball.y = 50;
                ball.speedX = 4;
                ball.speedY = 4;
                document.getElementById('score').innerText = score;
                document.getElementById('level').innerText = level;
            }
        }

        function draw() {
            // Field
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();

            // Paddle
            ctx.fillStyle = paddle.color;
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);

            // Ball
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.fill();
            ctx.closePath();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
